<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1" />
    </linearGradient>
  </defs>
  <!-- Outer Shield Outline -->
  <path d="M50 8 L85 24 V52 C85 72 50 92 50 92 C50 92 15 72 15 52 V24 Z" 
        fill="url(#glowGrad)" stroke="url(#shieldGrad)" stroke-width="4" stroke-linejoin="round" />
  <!-- Circuit / Neural Nodes inside Shield -->
  <circle cx="50" cy="38" r="5" fill="#38bdf8" />
  <circle cx="34" cy="54" r="4" fill="#06b6d4" />
  <circle cx="66" cy="54" r="4" fill="#06b6d4" />
  <circle cx="50" cy="70" r="4.5" fill="#60a5fa" />
  <!-- Interconnecting Circuit Lines -->
  <line x1="50" y1="38" x2="34" y2="54" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="50" y1="38" x2="66" y2="54" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="34" y1="54" x2="50" y2="70" stroke="#38bdf8" stroke-width="2.5" />
  <line x1="66" y1="54" x2="50" y2="70" stroke="#38bdf8" stroke-width="2.5" />
  <!-- Central Lock / Core -->
  <circle cx="50" cy="54" r="7" fill="#0f172a" stroke="#38bdf8" stroke-width="2" />
  <circle cx="50" cy="54" r="2.5" fill="#38bdf8" />
</svg>
